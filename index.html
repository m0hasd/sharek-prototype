function go(route,id){ui.route=route;if(id)ui.selected=id;ui.bell=false;ui.errors={};ui.tab='details';render();window.scrollTo(0,0);}
function openApp(id){const a=db.apps.find(a=>a.id===id);if(!a||!visible(a))return;go(a.status==='Draft'&&db.role==='applicant'?'form':'detail',id);}
function shell(content){const r=ROLES[db.role],n=newCount();return '<div class="layout"><aside class="sidebar"><div class="logo">sharek<span>.</span></div><div class="logo-sub">Government Services Workspace</div><div class="nav-title">Workspace</div><button class="navitem '+(['tracker','detail','form'].includes(ui.route)?'on':'')+'" data-action="tracker" title="Application Tracker">'+I('grid',18)+'<span>Application Tracker</span></button><div class="navbottom"><button class="navitem '+(['guide','screens'].includes(ui.route)?'on':'')+'" data-action="guide" title="Guide & Help">'+I('help',18)+'<span>Guide & Help</span></button><div class="agency">Department of<br>Community Development</div></div></aside><div class="body-area"><header class="workspace-header"><div><div class="workspace-name">Worship Room Approval</div><div class="workspace-sub">Government-to-government services</div></div><div class="header-right"><button class="bell '+(n?'has-new':'')+'" data-action="bell" aria-label="Notifications'+(n?', '+n+' unread':'')+'" aria-expanded="'+ui.bell+'">'+I('bell',18)+(n?'<span class="bell-count">'+n+'</span>':'')+'</button><div class="identity '+r[3]+'"><span class="avatar">'+r[2]+'</span><div><div class="identity-org">'+r[0]+' · '+(db.role==='applicant'?'Applying Entity':'Reviewing Authority')+'</div><label class="visually-hidden" for="role">Active organisation and role</label><select class="role-select" id="role">'+Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'" '+(k===db.role?'selected':'')+'>'+v[1]+'</option>').join('')+'</select></div></div></div></header><main id="content" class="workspace-main">'+content+'</main></div></div>'+(ui.bell?popover():'');}
function guide(){return '<div class="pagehead"><div><div class="eyebrow">Welcome to Sharek</div><h1>Workspace guide</h1></div><span class="small">'+I('shield',14)+' Government-to-government</span></div><section class="card"><div class="guide-body"><div><div class="eyebrow">Worship Room Approval</div><h2>One workspace. Clear ownership at every step.</h2><p>Create an application, follow its progress and complete each review. The organisation and active role are always visible at the top.</p><div class="actions">'+B('Open Application Tracker '+I('arrow',14),'tracker')+B('View screen-by-screen flow '+I('external',14),'screens','quiet')+'</div></div><div class="guide-steps">'+[['users','Choose your role','Work as the applying entity, a DCD reviewer or CID using the role selector.'],['grid','Open an application','Continue a draft or complete a review assigned to your role.'],['bell','Follow the next action','Track the responsible party. The bell highlights new notifications.']].map(([i,t,p])=>'<div class="guide-step"><div class="square-icon">'+I(i,17)+'</div><div><h3>'+t+'</h3><p>'+p+'</p></div></div>').join('')+'</div></div><div class="guide-parties">'+[['building','Apply','Abu Dhabi Airports','Submit applications, respond to information requests and receive the approval.'],['users','Review','DCD & CID','Check application details, review documents and pass work to the next role.'],['shield','Decide','DCD Executive Director','Record the final approval or rejection after the reviews are complete.']].map(([i,k,t,p])=>'<div class="guide-party">'+I(i,21)+'<div class="eyebrow">'+k+'</div><h3>'+t+'</h3><p>'+p+'</p></div>').join('')+'</div></section><details class="card tools"><summary>Walkthrough tools '+I('down',14)+'</summary><div class="tools-content"><p class="small">Load an example at a particular stage. These tools are separate from the working screens.</p><div class="tools-row"><div class="field"><label for="scenario">Starting point</label><select id="scenario"><option value="draft">Applicant · Saved draft</option><option value="review">DCD · Initial review</option><option value="decision">DCD · Final decision</option><option value="correction">Applicant · Information requested</option><option value="approved">Applicant · Approved application</option><option value="blocked">Applicant · Existing airport room</option><option value="exception">Applicant · Approved airport exception</option></select></div>'+B('Load Walkthrough','load-scenario','secondary')+'</div><div class="tools-row" style="justify-content:space-between"><span class="small">Restore the original example records.</span>'+B(I('reset',14)+' Reset Workspace','reset','quiet')+'</div></div></details><p class="footnote">Interactive prototype. Reviews, role switching, files and notifications are demonstrated locally in this browser. No real application or message is sent. Example documents are marked as previews.</p>';}
function matches(a,f,role=db.role){return f==='all'||f==='assigned'&&owner(a)===role&&!done(a)||f==='drafts'&&a.status==='Draft'||f==='action'&&a.status==='Action Required'||f==='review'&&a.status==='Under Review'||f==='completed'&&done(a);}
function filtered(records=db.apps,role=db.role,f=ui.filter,q=ui.query){return records.filter(a=>visible(a,role)&&matches(a,f,role)&&[a.ref,a.data.entity,a.data.terminal,a.data.admin,a.status].join(' ').toLowerCase().includes(q.toLowerCase()));}
function tracker(role=db.role,records=db.apps,f=ui.filter,q=ui.query){const all=records.filter(a=>visible(a,role)),tabs=role==='applicant'?[['all','All Applications'],['drafts','Drafts'],['action','Action Required'],['review','Under Review'],['completed','Completed']]:[['assigned','Assigned to Me'],['all','All Applications'],['action','Action Required'],['review','Under Review'],['completed','Completed']];return '<div class="pagehead"><div><div class="eyebrow">Workspace</div><h1>Application Tracker</h1><p class="sub">'+(role==='applicant'?'Your drafts, applications and next actions.':'Applications, review assignments and current progress.')+'</p></div>'+(role==='applicant'?B(I('plus',14)+' New Application','new'):'')+'</div><section class="card"><div class="searchline"><div class="searchbox">'+I('search',15)+'<input type="search" id="search" aria-label="Search applications" placeholder="Search by reference, entity or terminal" value="'+esc(q)+'"></div><span class="small">'+all.length+' applications in your workspace</span></div><div class="filterbar" role="tablist" aria-label="Application filters">'+tabs.map(([k,t])=>'<button class="filter '+(f===k?'on':'')+'" role="tab" aria-selected="'+(f===k)+'" data-filter="'+k+'">'+t+'<span class="count">'+all.filter(a=>matches(a,k,role)).length+'</span></button>').join('')+'</div><div id="rows">'+rows(filtered(records,role,f,q),f)+'</div></section><p class="footnote">'+(role==='applicant'?'Drafts are saved automatically. An application reference is assigned on submission.':'Only the assigned role can complete a review or record a decision.')+'</p>';}
function rows(list,f=ui.filter){if(!list.length)return '<div class="empty"><div class="square-icon">'+I('grid',21)+'</div><h3>'+(f==='assigned'?'No applications assigned to you':'No matching applications')+'</h3><p>'+(f==='assigned'?'Choose All Applications to follow progress, or change your active role.':'Try a different filter or search term.')+'</p></div>';return '<div class="tablewrap"><table class="tracker-table"><thead><tr><th scope="col">Application</th><th scope="col">Applying Entity</th><th scope="col">Status</th><th scope="col">Current Owner</th><th scope="col">Last Updated</th><th scope="col"><span class="visually-hidden">Open</span></th></tr></thead><tbody>'+list.map(a=>{const o=owner(a),r=o?ROLES[o]:null;return '<tr><td><div class="application-cell"><div class="file-icon">'+I('file',17)+'</div><div><button class="app-title" data-open="'+a.id+'">Worship room · '+esc(a.data.terminal||'New application')+'</button><div class="reference">'+esc(a.ref||'Unsubmitted draft')+'</div></div></div></td><td>'+esc(a.data.entity)+'<div class="orgnote">'+esc(a.data.airport)+'</div></td><td>'+badge(a)+'</td><td>'+(r?r[1]+'<div class="orgnote">'+r[0]+'</div>':'<span class="small">Completed</span>')+'</td><td class="small">'+date(a.updated)+'</td><td><button class="row-button" data-open="'+a.id+'" aria-label="Open '+esc(a.ref||'saved draft')+'">'+I('arrow',13)+'</button></td></tr>';}).join('')+'</tbody></table></div>';}
function detailsData(a){return [['Entity & Airport',['entity','licence','airport','region','terminal','location']],['Administrator',['admin','eid','eidExpiry','dob','email','phone']]].map(([t,keys])=>'<section class="data-section"><h3>'+t+'</h3><dl class="data-grid">'+keys.map(k=>'<div><dt>'+FIELDS[k]+'</dt><dd>'+esc(a.data[k]||'—')+'</dd></div>').join('')+'</dl></section>').join('');}
function documents(a){return DOCS.map(([id,t,req])=>'<div class="document-row"><div class="file-icon">'+I('file',17)+'</div><div class="doc-info"><h3>'+t+(!req?' <span class="small">· Optional</span>':'')+'</h3><p>'+esc(a.uploads[id]?.name||'Not attached')+'</p></div>'+(a.uploads[id]?'<button class="iconbtn" data-doc="'+id+'" data-id="'+a.id+'" aria-label="View '+t+'">'+I('eye',15)+'</button><button class="iconbtn" data-doc="'+id+'" data-id="'+a.id+'" data-download="1" aria-label="Download '+t+'">'+I('download',15)+'</button>':'')+'</div>').join('');}
function progress(a){const phase=done(a)?4:a.index>=8?3:a.index>=3?2:1;return '<div class="progress-track">'+['Submitted','DCD Review','Security Review','Final Decision','Completed'].map((t,i)=>'<div class="phase '+(i<phase?'done':i===phase?'current':'')+'"><span class="phase-dot">'+(i<phase?'✓':i+1)+'</span>'+t+'</div>').join('')+'</div><details class="history"><summary>Activity History '+I('down',13)+'</summary><ol class="timeline">'+a.history.map(h=>'<li><strong>'+esc(h.title)+'</strong>'+(h.body?'<p>'+esc(h.body)+'</p>':'')+'<small>'+stamp(h.time)+(ROLES[h.role]?' · '+ROLES[h.role][0]+' / '+ROLES[h.role][1]:'')+'</small></li>').join('')+'</ol></details>';}
function decision(a,role){let title='Application Actions',text='',buttons='';if(done(a)){title='Decision Recorded';text='The Executive Director has recorded the final decision. The application remains available.';}else if(a.held)text='A review outcome is outstanding. No final decision has been recorded.';else if(!allowed(a,role)){text='No action is required from your role at this stage.';buttons='<div class="readonly">Assigned to<br><strong>'+ROLES[owner(a)][0]+' · '+ROLES[owner(a)][1]+'</strong></div>';}else if(a.status==='Draft'){title='Continue Your Draft';text='Complete the details and attach the required documents before submitting.';buttons=B('Continue Application '+I('arrow',14),'resume');}else if(a.status==='Action Required'){title='Your Response Is Needed';text='Update the requested items and send your response to DCD.';buttons=B('Update & Respond '+I('arrow',14),'respond');}else if(a.flag){title='Information Request';text='Review the comments from '+ROLES[a.flag.from][1]+' before contacting the applying entity.';buttons='<div class="callout warn" style="margin-bottom:14px">'+esc(a.flag.comment)+'</div>'+B('Send Information Request','correction');}else{title=STAGES[a.index][1];text=a.index===8?'Review the completed application and recorded outcomes, then make the final decision.':'Review the application details and documents before passing it to the next responsible role.';buttons=B(STAGES[a.index][2],a.index===8?'approve':'advance');if([0,1,2,6,8].includes(a.index))buttons+=B('Request Information','correction','secondary');if(a.index===8)buttons+=B('Reject Application','reject','danger');}return '<div class="pad"><div class="eyebrow">'+(allowed(a,role)?'Assigned to You':'Your Workspace')+'</div><h2>'+title+'</h2><p>'+text+'</p><div class="decision-actions">'+buttons+'</div><div class="signed">'+avatar(role)+'<span>'+ROLES[role][0]+'<br>'+ROLES[role][1]+'</span></div></div>';}
function outcome(a){return '<div class="outcome-panel '+(a.status==='Rejected'?'rejected':'')+'"><div class="outcome-symbol">'+I(a.status==='Approved'?'check':'close',18)+'</div><div><h3>'+(a.status==='Approved'?'Application approved':'Application rejected')+'</h3><p>'+(a.status==='Approved'?'The Worship Room Approval / NOC is available for download.':esc(a.reason))+'</p>'+(a.status==='Approved'?B(I('download',14)+' Download NOC','download','small','data-id="'+a.id+'"'):'')+'</div></div>';}
function detail(a,role=db.role,tab=ui.tab){if(!a||!visible(a,role))return '<div class="empty"><h2>Application unavailable</h2><p>Return to the tracker to view applications available to your role.</p>'+B('Application Tracker','tracker')+'</div>';const o=owner(a),r=o?ROLES[o]:null;return '<button class="backlink" data-action="tracker">'+I('back',13)+' Application Tracker</button><div class="pagehead"><div><div class="eyebrow">'+esc(a.ref||'Saved Draft')+'</div><h1>Worship room approval</h1><p class="sub">'+esc(a.data.entity)+' · '+esc(a.data.terminal)+' · Updated '+date(a.updated)+'</p></div>'+badge(a)+'</div><div class="detail-layout"><div class="detail-left">'+(r?'<div class="owner-strip '+r[3]+'">'+avatar(o)+'<div><div class="eyebrow">Current Responsible Party</div><h3>'+r[0]+' · '+r[1]+'</h3><p>'+(a.status==='Action Required'?'Response requested from the applying entity':a.flag?'Information request to coordinate':STAGES[a.index][1])+'</p></div>'+badge(a)+'</div>':'')+(a.status==='Action Required'?'<div class="callout warn"><h3>Information requested by DCD</h3>'+esc(a.correction?.comment)+'</div>':'')+(done(a)?outcome(a):'')+'<section class="card"><div class="record-tabs" role="tablist" aria-label="Application record">'+[['details','Application Details'],['documents','Documents ('+Object.keys(a.uploads).length+')']].map(([k,t])=>'<button role="tab" aria-selected="'+(tab===k)+'" class="record-tab '+(tab===k?'on':'')+'" data-tab="'+k+'">'+t+'</button>').join('')+'</div><div class="pad">'+(tab==='documents'?documents(a):detailsData(a))+'</div></section><section class="card pad"><h3>Application Progress</h3>'+progress(a)+'</section></div><aside class="card decision-panel">'+decision(a,role)+'</aside></div>';}
function editable(a,k){if(k==='airport')return false;if(a.status==='Draft')return true;const areas=a.correction?.areas||[];return a.status==='Action Required'&&areas.includes(['entity','licence','region','terminal','location'].includes(k)?'room':'administrator');}
function field(a,k,type='text',options){const error=ui.errors[k],lock=!editable(a,k);return '<div class="field"><label for="field-'+k+'">'+FIELDS[k]+(k==='airport'?'':' <span class="required">*</span>')+'</label>'+(options?'<select id="field-'+k+'" data-field="'+k+'" '+(lock?'disabled':'')+' aria-invalid="'+!!error+'"><option value="">Select an option</option>'+options.map(o=>'<option '+(a.data[k]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input id="field-'+k+'" data-field="'+k+'" type="'+type+'" value="'+esc(a.data[k]||'')+'" '+(lock?'readonly':'')+' aria-invalid="'+!!error+'" '+(error?'aria-describedby="error-'+k+'"':'')+'>')+(error?'<span class="field-error" id="error-'+k+'">'+error+'</span>':k==='airport'?'<span class="hint">From your entity profile</span>':'')+'</div>';}
function formDetails(a){return '<section class="form-section"><h3>Entity & Airport</h3><div class="formgrid">'+field(a,'entity')+field(a,'licence')+field(a,'airport')+field(a,'region','text',['Abu Dhabi','Al Ain','Al Dhafra'])+field(a,'terminal','text',['Terminal A','Terminal 1','Terminal 2','Other terminal'])+field(a,'location','text',['Departures — airside','Arrivals — landside','Transit area','Other designated area'])+'</div><div class="allocation '+(a.existing&&!a.exception?'blocked':'')+'">'+I('check',14)+'<span>'+(a.existing?(a.exception?'An approved airport allocation exception is recorded.':'A worship room already exists at this airport. An approved exception is required before submission.'):'No existing worship room is recorded at this airport.')+'</span></div></section><section class="form-section"><h3>Administrator</h3><div class="formgrid">'+field(a,'admin')+field(a,'eid')+field(a,'eidExpiry','date')+field(a,'dob','date')+field(a,'email','email')+field(a,'phone','tel')+'</div></section>';}
function formDocuments(a){return '<h3>Supporting Documents</h3><p class="sub">Attach a PDF, PNG or JPEG for each required document.</p>'+DOCS.map(([id,t,req])=>{const u=a.uploads[id],lock=a.status==='Action Required'&&!a.correction.areas.includes(id);return '<div class="upload '+(u?'good':'')+'"><div class="title">'+t+(req?' <span class="required">*</span>':' <span class="small">· Optional</span>')+'</div><small>'+esc(u?.name||'No file attached')+'</small>'+(lock?'<p class="hint" style="margin-top:10px">Retained from your submitted application</p>':'<input type="file" data-upload="'+id+'" aria-label="Upload '+t+'" accept=".pdf,.png,.jpg,.jpeg">')+(ui.errors[id]?'<p class="field-error">'+ui.errors[id]+'</p>':'')+(u?'<div class="actions" style="margin-top:8px">'+B('View','view-file','quiet small','data-file="'+id+'"')+(!lock?B('Remove','remove-file','quiet small','data-file="'+id+'"'):'')+'</div>':'')+'</div>';}).join('');}
function formReview(a){return '<h3 style="margin-bottom:23px">Review Your Application</h3>'+detailsData(a)+'<div class="data-section"><h3>Supporting Documents</h3>'+documents(a)+'</div><details style="margin-top:25px"><summary>Allocation Conditions</summary><ol class="small" style="line-height:1.9">'+TERMS.map(t=>'<li>'+t+'</li>').join('')+'</ol></details>'+(a.status==='Action Required'?'<div class="field" style="margin-top:25px"><label for="response">Response to DCD <span class="required">*</span></label><textarea id="response" rows="4" aria-invalid="'+!!ui.errors.response+'">'+esc(a.correction.response||'')+'</textarea>'+(ui.errors.response?'<span class="field-error">'+ui.errors.response+'</span>':'')+'</div>':'<div class="declaration">By submitting, you confirm that the information and documents provided are accurate and the proposed room meets the allocation conditions.</div>');}
function form(a,step=a?.step,role=db.role){if(!a||role!=='applicant'||!['Draft','Action Required'].includes(a.status))return detail(a,role);const corr=a.status==='Action Required';return '<button class="backlink" data-action="tracker">'+I('back',13)+' Application Tracker</button><div class="pagehead"><div><div class="eyebrow">Abu Dhabi Airports · '+esc(a.ref||'Draft Application')+'</div><h1>'+(corr?'Update application':'New worship room application')+'</h1><p class="sub">'+(corr?'Only the requested areas are available for correction.':'Your progress is saved automatically.')+'</p></div>'+B('Save & Close','save-close','secondary')+'</div><div class="form-stepper">'+['Application Details','Documents','Review & Submit'].map((t,i)=>'<div class="form-step '+(step===i+1?'on':'')+'"><span>'+(step>i+1?'✓':i+1)+'</span>'+t+'</div>').join('')+'</div><div class="detail-layout"><section class="card"><div class="pad">'+(Object.keys(ui.errors).length?'<div class="callout error" role="alert">Please check the highlighted fields before continuing.</div>':'')+(corr?'<div class="callout warn" style="margin-bottom:24px"><h3>DCD requested</h3>'+esc(a.correction.comment)+'</div>':'')+(step===1?formDetails(a):step===2?formDocuments(a):formReview(a))+'</div><div class="form-footer">'+B(step===1?'Cancel':'Back',step===1?'save-close':'back','secondary')+B(step===3?(corr?'Resubmit Application':'Submit Application'):'Continue '+I('arrow',14),step===3?'submit':'next')+'</div></section><aside class="card pad formhelp"><div class="eyebrow">Applying Entity</div><h3>Abu Dhabi Airports</h3><p>The airport is linked to your entity profile. Confirm the room location and administrator details.</p><h3>Required Documents</h3><p>Administrator Police Clearance<br>Approved Architectural Drawings</p><h3>Airport Allocation</h3><p>One worship room per airport. An additional room requires an approved exception.</p></aside></div>';}
function notificationRow(n){return '<button class="notification-row '+(n.read?'':'unread')+'" data-notice="'+n.id+'"><span class="notice-dot"></span><span><strong>'+esc(n.title)+'</strong><p>'+esc(n.body)+'</p><time>'+stamp(n.time)+'</time></span></button>';}
function notices(role=db.role,list=db.notices){const ns=list.filter(n=>n.role===role);return '<div class="pagehead"><div><div class="eyebrow">'+ROLES[role][0]+' · '+ROLES[role][1]+'</div><h1>Notifications</h1><p class="sub">Assignments, application updates and actions for your role.</p></div>'+B('Mark All as Read','read-all','secondary')+'</div><section class="card">'+(ns.length?ns.map(notificationRow).join(''):'<div class="empty"><h3>You’re all caught up</h3><p>There are no notifications for this role.</p></div>')+'</section>';}
function popover(){const ns=db.notices.filter(n=>n.role===db.role);return '<section class="notifications-popover" aria-label="Notifications"><div class="cardbar"><h2>Notifications'+(newCount()?' <span class="small">('+newCount()+' new)</span>':'')+'</h2><button class="iconbtn" data-action="close-bell" aria-label="Close notifications">'+I('close',16)+'</button></div>'+(ns.length?ns.slice(0,6).map(notificationRow).join(''):'<div class="empty" style="padding:35px 20px"><h3>You’re all caught up</h3><p>New assignments and updates will appear here.</p></div>')+'<div class="popover-footer">'+B('Mark All as Read','read-all','quiet small')+B('View All','notices','quiet small')+'</div></section>';}
function render(){const body=ui.route==='guide'?guide():ui.route==='tracker'?tracker():ui.route==='form'?form(active()):ui.route==='screens'?screenBoard():ui.route==='notices'?notices():detail(active());$('#root').innerHTML=shell(body);if(ui.route==='screens')requestAnimationFrame(fitScreens);}
function validate(a,step){const err={};if(step===1){for(const k of Object.keys(FIELDS))if(!String(a.data[k]||'').trim())err[k]=FIELDS[k]+' is required.';if(a.data.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.data.email))err.email='Enter a valid email address.';if(a.data.eid&&!/^784\d{12}$/.test(a.data.eid.replace(/[-\s]/g,'')))err.eid='Enter a 15-digit Emirates ID starting with 784.';if(a.data.dob&&a.data.dob>new Date().toISOString().slice(0,10))err.dob='Date of birth cannot be in the future.';if(a.existing&&!a.exception)err.location='An approved airport allocation exception is required.';}if(step===2)for(const [id,t,req] of DOCS){if(req&&!a.uploads[id])err[id]='Attach '+t+'.';if(a.status==='Action Required'&&a.correction.areas.includes(id)&&a.uploads[id]&&a.uploads[id].revision<=(a.correction.baseline[id]||0))err[id]='Replace this document as requested by DCD.';}return err;}
function modal(title,body,actions){$('#modal').className='';$('#modal').innerHTML='<div class="modal-head"><h2>'+title+'</h2><button class="iconbtn" data-action="close-modal" aria-label="Close dialog">'+I('close',17)+'</button></div><div class="modal-body">'+body+'</div><div class="modal-actions">'+actions+'</div>';$('#modal').showModal();}function closeModal(){if($('#modal').open)$('#modal').close();}
function requestInformation(a){if(!allowed(a)||a.status!=='Under Review')return;const f=a.flag;modal('Request Information','<p class="sub" style="margin-bottom:20px">'+(db.role==='specialist'?'Send the requested items to the authorised representative.':'The Licensing Specialist will coordinate this request with the applying entity.')+'</p><div class="field"><label for="comment">Required information <span class="required">*</span></label><textarea id="comment" rows="4">'+esc(f?.comment||'')+'</textarea><span class="field-error" id="modal-error"></span></div><h3 style="margin-top:22px">Items to update</h3><div class="checks">'+[['room','Entity & airport details'],['administrator','Administrator details'],['clearance','Police Clearance'],['drawings','Architectural Drawings'],['support','Supporting Documents']].map(([k,t])=>'<label><input type="checkbox" name="area" value="'+k+'" '+((f?.areas||['room']).includes(k)?'checked':'')+'>'+t+'</label>').join('')+'</div>',B('Cancel','close-modal','secondary')+B(db.role==='specialist'?'Send to Applicant':'Send to Licensing Specialist','send-information'));}
function pdf(title,lines,plan=false){const clean=t=>String(t).replace(/[^\x20-\x7e]/g,'-').replace(/([\\()])/g,'\\$1');let s='0.12 0.25 0.28 rg BT /F1 10 Tf 50 790 Td (SHAREK - DOCUMENT PREVIEW) Tj ET\nBT /F1 19 Tf 50 750 Td ('+clean(title)+') Tj ET\n0.75 0.8 0.8 RG 50 730 m 545 730 l S\n';lines.forEach((t,i)=>s+='BT /F1 11 Tf 50 '+(700-i*29)+' Td ('+clean(t)+') Tj ET\n');if(plan)s+='0.3 0.4 0.4 RG 1.5 w 80 240 420 240 re S 290 240 m 290 400 l S 80 400 m 500 400 l S BT /F1 11 Tf 110 340 Td (WORSHIP ROOM) Tj ET BT /F1 10 Tf 320 340 Td (SUPPORTING FACILITIES) Tj ET\n';s+='0.6 0.45 0.25 rg BT /F1 10 Tf 50 65 Td (PROTOTYPE PREVIEW - NOT AN OFFICIAL DOCUMENT) Tj ET\n';const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+s.length+' >>\nstream\n'+s+'endstream'];let text='%PDF-1.4\n',offset=[];objs.forEach((o,i)=>{offset.push(text.length);text+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});const start=text.length;text+='xref\n0 6\n0000000000 65535 f \n'+offset.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF';return new Blob([text],{type:'application/pdf'});}
function deliver(blob,name,view=false){const url=URL.createObjectURL(blob);if(view)window.open(url,'_blank','noopener');else{const a=document.createElement('a');a.href=url;a.download=name;a.click();}setTimeout(()=>URL.revokeObjectURL(url),120000);}
function download(a){if(!a||a.status!=='Approved'||!visible(a))return;deliver(pdf('Worship Room Approval / NOC',['Application: '+a.ref,'Applying entity: '+a.data.entity,'Airport: '+a.data.airport,'Terminal: '+a.data.terminal,'Location: '+a.data.location,'Administrator: '+a.data.admin,'Final authority: DCD Executive Director','Decision: Approved','Date: '+date(a.updated)]),a.ref+'-NOC.pdf');}
function fileDB(){if(fileDatabase)return fileDatabase;fileDatabase=new Promise(resolve=>{try{const r=indexedDB.open('sharek-workspace-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null);}catch{resolve(null);}});return fileDatabase;}
async function putFile(key,file){fileMemory.set(key,file);const db=await fileDB();if(db)try{await new Promise(resolve=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,key);tx.oncomplete=resolve;tx.onerror=resolve;});}catch{}}
async function getFile(key){if(fileMemory.has(key))return fileMemory.get(key);const db=await fileDB();if(!db)return null;try{return await new Promise(resolve=>{const r=db.transaction('files').objectStore('files').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null);});}catch{return null;}}
async function openFile(a,id,download=false){const d=DOCS.find(d=>d[0]===id),u=a?.uploads[id];if(!d||!u||!visible(a))return;const f=u.example?pdf(id==='drawings'?'Worship Room Architectural Plan':d[1],['Applying entity: '+a.data.entity,'Airport: '+a.data.airport,'Administrator: '+a.data.admin,'Example document for the interactive walkthrough.'],id==='drawings'):await getFile(a.id+'-'+id);if(!f){toast('Reattach this file to make it available in this browser.');return;}deliver(f,u.name,!download);}
function loadScenario(type){const a=record('Under Review');a.ref='SHK-2026-'+String(db.counter++).padStart(6,'0');examples(a);a.history=[{title:'Application submitted',body:'Sent to DCD for initial review.',role:'applicant',time:now()}];db.role='analyst';if(['draft','blocked','exception'].includes(type)){a.status='Draft';a.ref='';db.role='applicant';a.existing=type!=='draft';a.exception=type==='exception';}if(type==='correction'){a.status='Action Required';db.role='applicant';a.correction={comment:'Please confirm the proposed worship room location within the terminal.',areas:['room'],response:'',baseline:{}};notice(a,'applicant','Information required',a.correction.comment);}if(type==='decision'){a.index=8;db.role='director';}if(type==='approved'){a.status='Approved';a.index=8;db.role='applicant';log(a,'Executive Director approved','Worship Room Approval / NOC issued.','director');notice(a,'applicant','Application approved',a.ref+' · Your NOC is available.');}db.apps.unshift(a);ui.filter=db.role==='applicant'?'all':'assigned';save();go(a.status==='Draft'?'form':'detail',a.id);}
function definitions(){return [{group:'Applicant',title:'Application Tracker',role:'applicant',view:'tracker'},{group:'Applicant',title:'Application Details',role:'applicant',view:'form',step:1},{group:'Applicant',title:'Supporting Documents',role:'applicant',view:'form',step:2},{group:'Applicant',title:'Review & Submit',role:'applicant',view:'form',step:3},{group:'Applicant',title:'Submission & Tracking',role:'applicant',view:'detail'},...STAGES.map(([r,n],i)=>({group:'Review',title:n,role:r,view:'detail',index:i})),{group:'Outcomes',title:'Approval & NOC',role:'applicant',view:'approved'},{group:'Outcomes',title:'Final Rejection',role:'applicant',view:'rejected'},{group:'Outcomes',title:'Role Notifications',role:'applicant',view:'notices'},{group:'Corrections & Allocation',title:'Specialist Information Request',role:'specialist',view:'flag',index:1},{group:'Corrections & Allocation',title:'Applicant Action Required',role:'applicant',view:'correction'},{group:'Corrections & Allocation',title:'Update Requested Items',role:'applicant',view:'response',step:1},{group:'Corrections & Allocation',title:'Response & Resubmission',role:'applicant',view:'response',step:3},{group:'Corrections & Allocation',title:'Airport Allocation Check',role:'applicant',view:'blocked',step:1},{group:'Corrections & Allocation',title:'Approved Airport Exception',role:'applicant',view:'exception',step:1}];}
function screenDoc(d){const a=record('Under Review',d.index||0);a.id='screen';a.ref='SHK-2026-000077';examples(a);a.history=[{title:'Application submitted',body:'Assigned to DCD for initial review.',role:'applicant',time:'2026-10-23T08:00:00Z'}];const errors=ui.errors;let content;try{ui.errors={};if(d.view==='tracker')content=tracker(d.role,[a],'all','');else if(d.view==='notices')content=notices(d.role,[{id:'screen-notice',role:'applicant',title:'Application approved',body:'Your Worship Room Approval / NOC is available to download.',time:'2026-10-23T09:30:00Z',read:false}]);else{if(['form','blocked','exception'].includes(d.view)){a.status='Draft';a.ref='';a.existing=d.view!=='form';a.exception=d.view==='exception';}if(d.view==='approved')a.status='Approved';if(d.view==='rejected'){a.status='Rejected';a.reason='The proposed room does not satisfy the allocation conditions.';}if(d.view==='flag')a.flag={from:'analyst',comment:'Please confirm the proposed room location.',areas:['room']};if(['correction','response'].includes(d.view)){a.status='Action Required';a.correction={comment:'Please confirm the proposed room location within the terminal.',areas:['room'],response:'The proposed room is in the departures airside area of Terminal A.',baseline:{}};}content=['form','blocked','exception','response'].includes(d.view)?form(a,d.step||1,d.role):detail(a,d.role,'details');}}finally{ui.errors=errors;}return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+document.querySelector('style').textContent+'<\/style><\/head><body><header class="static-header"><span class="logo">sharek<span>.</span></span><span class="small">'+ROLES[d.role][0]+' · '+ROLES[d.role][1]+'</span></header><main class="static-main">'+content+'</main><\/body></html>';}
function screenBoard(){const defs=definitions(),groups=[...new Set(defs.map(d=>d.group))];return '<button class="backlink" data-action="guide">'+I('back',13)+' Workspace Guide</button><div class="pagehead"><div><div class="eyebrow">Optional Walkthrough</div><h1>Screen-by-screen flow</h1><p class="sub">Follow the application from draft to final decision. Open a screen to view it at full size.</p></div>'+B('Open Interactive Workspace '+I('arrow',14),'tracker')+'</div>'+groups.map(g=>'<section class="screen-group"><h2>'+g+'</h2><div class="screen-grid">'+defs.map((d,i)=>d.group===g?'<article><div class="screen-label"><span>'+String(i+1).padStart(2,'0')+'</span>'+d.title+'</div><button class="screen-preview" data-screen="'+i+'" aria-label="Open screen '+(i+1)+': '+d.title+'"><div class="browser-dots"><i></i><i></i><i></i></div><div class="screen-viewport"><iframe title="'+d.title+' preview" sandbox="" data-frame="'+i+'" loading="lazy"></iframe></div></button><p class="screen-party">'+ROLES[d.role][0]+' · '+ROLES[d.role][1]+'</p></article>':'').join('')+'</div></section>').join('');}
function fitScreens(){document.querySelectorAll('[data-frame]').forEach(f=>{if(!f.srcdoc)f.srcdoc=screenDoc(definitions()[Number(f.dataset.frame)]);f.style.transform='scale('+f.parentElement.clientWidth/1200+')';});}
function openScreen(i){const ds=definitions();if(i<0||i>=ds.length)return;ui.screen=i;closeModal();$('#modal').className='flow-dialog';$('#modal').innerHTML='<div class="modal-head"><div><div class="eyebrow">Screen '+(i+1)+' · '+ROLES[ds[i].role][0]+' / '+ROLES[ds[i].role][1]+'</div><h2>'+ds[i].title+'</h2></div><button class="iconbtn" data-action="close-modal" aria-label="Close screen">'+I('close',17)+'</button></div><iframe id="full-screen" title="'+ds[i].title+'" sandbox=""></iframe><div class="modal-actions" style="justify-content:space-between">'+B(I('back',13)+' Previous','previous-screen','secondary',i===0?'disabled':'')+'<span class="small">'+(i+1)+' of '+ds.length+'</span>'+B('Next '+I('arrow',13),'next-screen','secondary',i===ds.length-1?'disabled':'')+'</div>';$('#full-screen').srcdoc=screenDoc(ds[i]);$('#modal').showModal();}
document.addEventListener('input',e=>{const a=active();if(e.target.dataset.field&&a&&db.role==='applicant'&&editable(a,e.target.dataset.field)){a.data[e.target.dataset.field]=e.target.value;a.updated=now();save();}if(e.target.id==='response'&&a?.correction&&db.role==='applicant'){a.correction.response=e.target.value;save();}if(e.target.id==='search'){ui.query=e.target.value;$('#rows').innerHTML=rows(filtered());}});
document.addEventListener('change',async e=>{if(e.target.id==='role'){db.role=e.target.value;ui.filter=db.role==='applicant'?'all':'assigned';ui.bell=false;ui.errors={};closeModal();if(['detail','form'].includes(ui.route))ui.route=active()&&visible(active())?'detail':'tracker';save();render();return;}const a=active();if(e.target.dataset.field&&a&&db.role==='applicant'&&editable(a,e.target.dataset.field)){a.data[e.target.dataset.field]=e.target.value;a.updated=now();save();}if(e.target.dataset.upload&&a&&db.role==='applicant'&&allowed(a)){const id=e.target.dataset.upload,f=e.target.files[0];if(!f)return;if(a.status==='Action Required'&&!a.correction.areas.includes(id))return;if(!/\.(pdf|png|jpe?g)$/i.test(f.name)){toast('Choose a PDF, PNG or JPEG file.');e.target.value='';return;}await putFile(a.id+'-'+id,f);a.uploads[id]={name:f.name,revision:Math.max(a.uploads[id]?.revision||0,a.correction?.baseline?.[id]||0)+1};a.updated=now();delete ui.errors[id];save();render();}});
document.addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){ui.filter=filter.dataset.filter;render();return;}const row=e.target.closest('[data-open]');if(row){openApp(row.dataset.open);return;}const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;render();return;}const note=e.target.closest('[data-notice]');if(note){const n=db.notices.find(n=>n.id===note.dataset.notice&&n.role===db.role);if(n){n.read=true;save();openApp(n.appId);}return;}const doc=e.target.closest('[data-doc]');if(doc){openFile(db.apps.find(a=>a.id===doc.dataset.id),doc.dataset.doc,doc.dataset.download==='1');return;}const screen=e.target.closest('[data-screen]');if(screen){openScreen(Number(screen.dataset.screen));return;}const b=e.target.closest('[data-action]');if(!b){if(ui.bell&&!e.target.closest('.notifications-popover')){ui.bell=false;render();}return;}const action=b.dataset.action,a=active();if(['guide','tracker','screens','notices'].includes(action)){go(action);return;}if(action==='bell'){ui.bell=!ui.bell;render();return;}if(action==='close-bell'){ui.bell=false;render();return;}if(action==='read-all'){db.notices.filter(n=>n.role===db.role).forEach(n=>n.read=true);save();render();return;}if(action==='close-modal'){closeModal();return;}if(action==='load-scenario'){loadScenario($('#scenario').value);return;}if(action==='new'){if(db.role!=='applicant')return;const n=record();n.data={entity:'Abu Dhabi Airports',airport:'Zayed International Airport'};db.apps.unshift(n);save();go('form',n.id);return;}if(action==='reset'){modal('Reset Workspace','<p class="sub">Remove locally saved applications and notifications and restore the original example records?</p>',B('Cancel','close-modal','secondary')+B('Reset Workspace','confirm-reset','danger'));return;}if(action==='confirm-reset'){db=seed();ui.filter='all';save();fileMemory.clear();fileDB().then(d=>{if(d)d.transaction('files','readwrite').objectStore('files').clear();});closeModal();go('guide');toast('Workspace reset.');return;}if(action==='previous-screen'||action==='next-screen'){openScreen(ui.screen+(action==='next-screen'?1:-1));return;}if(action==='download'){download(db.apps.find(x=>x.id===b.dataset.id)||a);return;}if(!a)return;
if(action==='resume'||action==='respond'){if(db.role==='applicant'&&allowed(a)){a.step=1;go('form',a.id);}return;}if(action==='save-close'){save();go('tracker');toast('Changes saved.');return;}if(action==='back'){if(db.role!=='applicant'||!allowed(a))return;a.step=Math.max(1,a.step-1);ui.errors={};save();render();window.scrollTo(0,0);return;}if(action==='next'){if(db.role!=='applicant'||!allowed(a))return;ui.errors=validate(a,a.step);if(!Object.keys(ui.errors).length)a.step=Math.min(3,a.step+1);save();render();window.scrollTo(0,0);return;}
if(action==='submit'){if(db.role!=='applicant'||!allowed(a))return;ui.errors={...validate(a,1),...validate(a,2)};if(a.status==='Action Required'&&!a.correction.response?.trim())ui.errors.response='Enter your response to DCD.';if(Object.keys(ui.errors).length){a.step=Object.keys(validate(a,1)).length?1:Object.keys(validate(a,2)).length?2:3;render();window.scrollTo(0,0);return;}const again=a.status==='Action Required';if(!again)a.ref='SHK-2026-'+String(db.counter++).padStart(6,'0');log(a,again?'Application resubmitted':'Application submitted',again?a.correction.response:'Application sent to DCD for initial review.');a.status='Under Review';a.index=0;a.flag=null;if(again){a.lastCorrection=a.correction;a.correction=null;}notice(a,'applicant',again?'Response received':'Application submitted',a.ref+' is with DCD for review.');assigned(a);save();go('detail',a.id);toast('Application submitted successfully.');return;}
if(action==='view-file'){openFile(a,b.dataset.file);return;}if(action==='remove-file'){const id=b.dataset.file;if(db.role!=='applicant'||!allowed(a)||a.status==='Action Required'&&!a.correction.areas.includes(id))return;delete a.uploads[id];save();render();return;}
if(action==='advance'){if(!allowed(a)||a.status!=='Under Review'||a.flag||a.index>=8)return;log(a,STAGES[a.index][1]+' completed','Review passed to the next responsible role.');a.index++;assigned(a);save();render();toast('Assigned to '+ROLES[owner(a)][0]+' · '+ROLES[owner(a)][1]+'.');return;}
if(action==='correction'){requestInformation(a);return;}if(action==='send-information'){if(!allowed(a)||a.status!=='Under Review')return;const comment=$('#comment').value.trim(),areas=[...document.querySelectorAll('input[name=area]:checked')].map(x=>x.value);if(!comment||!areas.length){$('#modal-error').textContent=!comment?'Describe the information required.':'Select at least one item to update.';return;}if(db.role==='specialist'){a.correction={comment,areas,response:'',baseline:Object.fromEntries(DOCS.map(([id])=>[id,a.uploads[id]?.revision||0]))};a.flag=null;a.status='Action Required';log(a,'Information requested by Licensing Specialist',comment);notice(a,'applicant','Information required',a.ref+' · '+comment);}else{a.flag={from:db.role,comment,areas};log(a,'Information request referred to Licensing Specialist',comment);a.index=1;assigned(a);}save();closeModal();render();toast(db.role==='specialist'?'Information request sent to the applicant.':'Sent to the Licensing Specialist for coordination.');return;}
if(action==='approve'||action==='reject'){if(db.role!=='director'||!allowed(a)||a.index!==8)return;if(action==='approve')modal('Approve Application','<p class="sub">Confirm the final approval for '+esc(a.ref)+'. The Worship Room Approval / NOC will become available to the applying entity.</p>',B('Cancel','close-modal','secondary')+B('Approve & Issue NOC','confirm-approve'));else modal('Reject Application','<div class="field"><label for="reason">Rejection reason <span class="required">*</span></label><textarea id="reason" rows="4"></textarea><span id="modal-error" class="field-error"></span></div>',B('Cancel','close-modal','secondary')+B('Confirm Rejection','confirm-reject','danger'));return;}
if(action==='confirm-approve'||action==='confirm-reject'){if(db.role!=='director'||!allowed(a)||a.index!==8)return;const approved=action==='confirm-approve',reason=approved?'':$('#reason').value.trim();if(!approved&&!reason){$('#modal-error').textContent='Enter the rejection reason.';return;}a.status=approved?'Approved':'Rejected';a.reason=reason;log(a,'Executive Director '+(approved?'approved':'rejected'),approved?'Worship Room Approval / NOC issued. Applicant email and Inspection Department notifications recorded.':reason);notice(a,'applicant',approved?'Application approved':'Application rejected',a.ref+' · '+(approved?'Your NOC is available to download. Email delivery has been recorded.':reason));save();closeModal();render();toast('Final decision recorded.');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.bell){ui.bell=false;render();}});window.addEventListener('resize',()=>{if(ui.route==='screens')fitScreens();});save();render();
</script></body></html>
